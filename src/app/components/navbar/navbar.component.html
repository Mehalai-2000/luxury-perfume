<nav class="luxury-navbar" [class.scrolled]="isScrolled">
  <!-- Left Side: Gold Handwritten Signature Logo -->
  <div class="navbar-left">
    <a routerLink="/" class="logo-text">Mystique Aroma</a>
  </div>

  <!-- Center/Right Side: Spaced Menu Items -->
  <div class="navbar-center">
    <ul class="nav-menu">
      <li class="nav-item"><a routerLink="/shop"
          [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'exact', matrixParams: 'ignored' }"
          routerLinkActive="active" class="nav-link">Shop</a></li>
      <li class="nav-item"><a [routerLink]="['/shop']" fragment="about-section"
          [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'exact', matrixParams: 'ignored' }"
          routerLinkActive="active" class="nav-link">About Us</a></li>
      <li class="nav-item"><a [routerLink]="['/shop']" fragment="faq-section"
          [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'exact', matrixParams: 'ignored' }"
          routerLinkActive="active" class="nav-link">FAQ</a></li>
      <li class="nav-item"><a [routerLink]="['/shop']" fragment="contact-section"
          [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'exact', matrixParams: 'ignored' }"
          routerLinkActive="active" class="nav-link">Contact Us</a></li>
    </ul>
  </div>

  <!-- Far Right: Circular Translucent Shopping Bag/Cart Icon -->
  <div class="navbar-right">
    <button class="cart-btn" aria-label="Shopping Cart" (click)="navigateToCart()">
      <!-- Minimalist elegant luxury cart/bag icon (SVG) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" class="cart-icon">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>
      <span class="cart-badge" *ngIf="(cartCount$ | async) as count">{{ count }}</span>
    </button>
  </div>
</nav>
